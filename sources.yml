# ---- 日本語訳の設定 ----
# 英語の記事タイトル・要約を日本語に訳す。MyMemory を使う。
# APIキーもクレジットカードも不要。
#
# 【準備】メールアドレスを登録すると1日の上限が5,000字→50,000字になる。
#   GitHubのリポジトリ → Settings → Secrets and variables → Actions
#   → New repository secret → Name: MYMEMORY_EMAIL、Secret: メールアドレス
#   （未登録でも動くが、匿名の5,000字/日ではタイトルの一部しか訳せない）
#
# メールはリポジトリには書かず、必ずSecretsに入れること（このリポジトリは公開設定）。
translate:
  enabled: true
  email_env: MYMEMORY_EMAIL
  sleep_sec: 0.6         # 1件ごとの間隔（相手サービスへの配慮）


# ---- 動作設定 ----
settings:
  max_items_per_feed: 15        # 1フィードあたり1回で取り込む最大件数
  max_new_items_per_run: 90     # 1回の実行で処理する新規記事の上限（AI無料枠保護）
  request_timeout_sec: 15
  lookback_days: 4              # 何日前までの記事を新規として扱うか
  max_summary_chars: 160        # 要約欄に出す文字数の上限
