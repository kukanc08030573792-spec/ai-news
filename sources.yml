# ---- Google News キーワード検索 ----
# proxy_for を書くと「公式RSSが無い企業の発表を報道経由で拾う」枠になり、
# サイトの「公式」タブに〈報道経由〉バッジ付きで表示される。
google_news_queries:
  - query: Anthropic OR Claude AI
    topic: ai
    proxy_for: Anthropic
  - query: TikTok 新機能 OR TikTok アップデート
    topic: sns
    proxy_for: TikTok
  - query: Instagram 新機能 OR Instagram アップデート
    topic: sns
    proxy_for: Instagram
  - query: X（旧Twitter）仕様変更 OR Twitter 新機能
    topic: sns
    proxy_for: X (Twitter)
  - query: LinkedIn 新機能 OR LinkedIn アップデート
    topic: sns
    proxy_for: LinkedIn
  # 以下は一般キーワード（tier=media 扱い）
  - query: 生成AI 業務活用 OR 生成AI 導入事例
    topic: ai
  - query: AIエージェント 業務自動化
    topic: ai
  - query: SNSマーケティング 最新動向
    topic: sns
  - query: ショート動画 マーケティング 戦略
    topic: sns


