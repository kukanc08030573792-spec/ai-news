<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI・SNSマーケ ニュース | 公式発表と重要人物の発信を毎朝自動収集</title>
<meta name="description" content="AI業界とSNSマーケティングの公式発表・重要人物の発信を毎朝自動収集">
<link rel="alternate" type="application/rss+xml" title="RSS" href="feed.xml">
<style>
:root{
  --accent:#4F46E5; --ink:#101828; --deep:#1E1B4B; --bg:#f6f7fb; --card:#fff;
  --text:#1f2330; --muted:#6b7280; --border:#e4e7ee;
  --official:#0B69D4; --voice:#9333EA; --media:#6b7280;
  --ai:#B45309; --sns:#0F766E;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
header{background:var(--deep);color:#fff;padding:18px 16px 0}
.hwrap{max-width:1100px;margin:0 auto}
h1{font-size:1.25rem;font-weight:700;display:flex;align-items:center;gap:8px}
h1 .dot{width:12px;height:12px;border-radius:50%;background:var(--accent);display:inline-block}
.sub{font-size:.78rem;opacity:.78;margin:4px 0 10px}
.sub a{color:#c7d2fe}
nav{display:flex;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch}
nav button{flex:none;background:transparent;border:none;color:#c9cbe0;padding:9px 13px;font-size:.86rem;cursor:pointer;border-radius:8px 8px 0 0;font-family:inherit;white-space:nowrap}
nav button.active{background:var(--bg);color:var(--deep);font-weight:700}
.toolbar{max-width:1100px;margin:14px auto 0;padding:0 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#q{flex:1;min-width:190px;padding:9px 14px;border:1px solid var(--border);border-radius:20px;font-size:.9rem;font-family:inherit;background:var(--card)}
.topics{display:flex;gap:6px}
.topics button{padding:7px 14px;border:1px solid var(--border);background:var(--card);border-radius:16px;cursor:pointer;font-size:.8rem;font-family:inherit;color:var(--muted)}
.topics button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
#status{font-size:.75rem;color:var(--muted)}
main{max-width:1100px;margin:14px auto 60px;padding:0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .15s}
.card:hover{box-shadow:0 4px 14px rgba(79,70,229,.14)}
.card.official{border-left:3px solid var(--official)}
.card.voice{border-left:3px solid var(--voice)}
.thumb{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,#e5e7f5,#cdd3ee);display:flex;align-items:center;justify-content:center;overflow:hidden;text-decoration:none}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .ph{font-size:2rem;opacity:.42}
.thumb .vid{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.72);color:#fff;font-size:.68rem;padding:2px 8px;border-radius:10px}
.body{padding:12px 14px 10px;display:flex;flex-direction:column;gap:7px;flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.66rem;padding:2px 9px;border-radius:10px;font-weight:700}
.chip.official{background:#e3efff;color:var(--official)}
.chip.voice{background:#f4e8ff;color:var(--voice)}
.chip.media{background:#eef0f3;color:var(--media)}
.chip.ai{background:#fdf1dc;color:var(--ai)}
.chip.sns{background:#ddf4f0;color:var(--sns)}
.chip.proxy{background:#fff4e5;color:#9a5b00;font-weight:600}
.title{font-size:.95rem;font-weight:700;line-height:1.45}
.title a{color:var(--text);text-decoration:none}
.title a:hover{color:var(--accent);text-decoration:underline}
.summary{font-size:.8rem;color:#4b5563}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:6px;border-top:1px dashed var(--border)}
.src{font-size:.7rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bm{flex:none;font-size:.74rem;text-decoration:none;border:1px solid var(--border);border-radius:14px;padding:3px 11px;color:var(--muted);background:#fff}
.bm:hover{border-color:var(--accent);color:var(--accent)}
.bm.on{background:var(--accent);border-color:var(--accent);color:#fff}
.months{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.months button{padding:7px 14px;border:1px solid var(--border);background:var(--card);border-radius:16px;cursor:pointer;font-size:.82rem;font-family:inherit}
.months button.active{background:var(--deep);color:#fff;border-color:var(--deep)}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.lk{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px}
.lk .name{font-weight:700;font-size:.92rem}
.lk .note{font-size:.78rem;color:var(--muted);margin:4px 0 8px}
.lk a{font-size:.8rem;color:var(--accent);text-decoration:none}
.lk a:hover{text-decoration:underline}
.empty{padding:60px 0;text-align:center;color:var(--muted);font-size:.9rem;grid-column:1/-1}
.more{display:block;margin:22px auto 0;padding:10px 34px;border:1px solid var(--border);background:var(--card);border-radius:22px;cursor:pointer;font-size:.88rem;font-family:inherit}
.more:hover{border-color:var(--accent);color:var(--accent)}
.notice{background:#fff8e6;border:1px solid #f0e2b6;border-radius:10px;padding:10px 14px;font-size:.78rem;color:#7a5d10;margin-bottom:14px}
footer{text-align:center;font-size:.72rem;color:var(--muted);padding:20px}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <h1><span class="dot"></span>AI・SNSマーケ ニュース</h1>
    <p class="sub">公式発表と重要人物の発信を毎朝6時台（JST）自動収集 ｜ <span id="updated"></span> ｜ <a href="feed.xml">RSS</a></p>
    <nav id="tabs"></nav>
  </div>
</header>

<div class="toolbar">
  <input id="q" type="search" placeholder="キーワード検索（タイトル・要約・ソース）">
  <div class="topics" id="topics">
    <button data-p="ai">AI</button>
    <button data-p="sns">SNSマーケ</button>
  </div>
  <span id="status"></span>
</div>

<main>
  <div id="notice"></div>
  <div id="months" class="months" style="display:none"></div>
  <div id="grid" class="grid"></div>
  <button id="more" class="more" style="display:none">もっと見る</button>
</main>

<footer>要約欄は配信元の説明文を整形したものです。内容は必ずリンク先の原文をご確認ください。</footer>

<script>
"use strict";
const TABS = [
  {id:"all",       label:"すべて"},
  {id:"official",  label:"🏛 公式"},
  {id:"voice",     label:"🎙 重要人物"},
  {id:"media",     label:"📰 メディア"},
  {id:"video",     label:"▶ 動画"},
  {id:"bookmarks", label:"★ ブックマーク"},
  {id:"links",     label:"🔗 公式リンク"},
  {id:"archive",   label:"📦 アーカイブ"},
];
const TIER_LABEL  = {official:"公式", voice:"重要人物", media:"メディア"};
const TOPIC_LABEL = {ai:"AI", sns:"SNSマーケ", other:"その他"};
const PAGE = 30;

let meta = {repo:"OWNER/REPO", manual_links:[], archive_months:[]};
let items = [], bookmarks = [], bmIds = new Set();
let tab = localStorage.getItem("tab") || "official";
let topics = new Set(JSON.parse(localStorage.getItem("topics") || "[]"));
let query = "", shown = PAGE;
let archiveMonth = null, archiveItems = [];

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function boot(){
  try{
    const [a, b] = await Promise.all([
      fetch("data/articles.json").then(r => r.json()),
      fetch("data/bookmarks.json").then(r => r.ok ? r.json() : []).catch(() => []),
    ]);
    meta = a.meta || meta;
    items = a.items || [];
    bookmarks = Array.isArray(b) ? b : [];
    bmIds = new Set(bookmarks.map(x => x.id));
    $("updated").textContent = meta.last_updated ? "最終更新 " + meta.last_updated.replace("T"," ").slice(0,16) : "";
    if(meta.repo === "OWNER/REPO"){
      $("notice").innerHTML = '<div class="notice">まだ初回収集が実行されていません。GitHubのActionsタブから「collect-news」を手動実行（Run workflow）してください。</div>';
    }
  }catch(e){
    $("notice").innerHTML = '<div class="notice">データの読み込みに失敗しました。初回収集が未実行の可能性があります。</div>';
  }
  renderTabs(); renderTopics(); render();
  $("q").addEventListener("input", ev => { query = ev.target.value.trim().toLowerCase(); shown = PAGE; render(); });
  $("more").addEventListener("click", () => { shown += PAGE; render(); });
}

function renderTabs(){
  $("tabs").innerHTML = TABS.map(t =>
    `<button data-t="${t.id}" class="${t.id===tab?"active":""}">${t.label}</button>`).join("");
  $("tabs").querySelectorAll("button").forEach(btn =>
    btn.addEventListener("click", () => {
      tab = btn.dataset.t;
      localStorage.setItem("tab", tab);
      $("tabs").querySelectorAll("button").forEach(b =>
        b.classList.toggle("active", b.dataset.t === tab));
      shown = PAGE;
      render();
    }));
}

function renderTopics(){
  $("topics").querySelectorAll("button").forEach(btn => {
    btn.classList.toggle("on", topics.has(btn.dataset.p));
    btn.addEventListener("click", () => {
      const p = btn.dataset.p;
      topics.has(p) ? topics.delete(p) : topics.add(p);
      localStorage.setItem("topics", JSON.stringify([...topics]));
      btn.classList.toggle("on", topics.has(p));
      shown = PAGE;
      render();
    });
  });
}

function filtered(){
  let pool;
  if(tab === "bookmarks") pool = bookmarks;
  else if(tab === "archive") pool = archiveItems;
  else if(tab === "video") pool = items.filter(x => x.type === "video");
  else if(tab === "all") pool = items;
  else pool = items.filter(x => x.tier === tab);
  // 話題チップ（未選択＝絞り込みなし）
  if(topics.size) pool = pool.filter(x => topics.has(x.topic));
  if(query) pool = pool.filter(x =>
    (x.title + " " + (x.summary||"") + " " + (x.source||"")).toLowerCase().includes(query));
  return pool;
}

function issueUrl(it, remove){
  const t = encodeURIComponent((remove ? "[BM削除] " : "[BM] ") + it.title.slice(0,80));
  const b = encodeURIComponent(`ID: ${it.id}\nURL: ${it.url}\n\n（このIssueはブックマーク${remove?"削除":"登録"}用です。送信後、自動で処理・クローズされます）`);
  return `https://github.com/${meta.repo}/issues/new?title=${t}&body=${b}`;
}

function card(it){
  const bm = bmIds.has(it.id);
  const chips = [
    it.tier  ? `<span class="chip ${esc(it.tier)}">${TIER_LABEL[it.tier]||esc(it.tier)}</span>` : "",
    it.topic && it.topic !== "other" ? `<span class="chip ${esc(it.topic)}">${TOPIC_LABEL[it.topic]}</span>` : "",
    it.proxy_for ? `<span class="chip proxy">${esc(it.proxy_for)}・報道経由</span>` : "",
  ].join("");
  const thumb = it.thumbnail
    ? `<img src="${esc(it.thumbnail)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`
    : "";
  const date = (it.published||"").slice(0,10);
  return `<article class="card ${esc(it.tier||"")}">
    <a class="thumb" href="${esc(it.url)}" target="_blank" rel="noopener">
      <span class="ph">${it.type==="video"?"▶":"📰"}</span>${thumb}
      ${it.type==="video"?'<span class="vid">▶ 動画</span>':""}
    </a>
    <div class="body">
      <div class="chips">${chips}</div>
      <h2 class="title"><a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a></h2>
      <p class="summary">${esc(it.summary||"")}</p>
      <div class="foot">
        <span class="src">${esc(it.source||"")}｜${esc(date)}</span>
        <a class="bm ${bm?"on":""}" target="_blank" rel="noopener"
           href="${issueUrl(it, bm)}"
           title="${bm?"ブックマークを削除（Issue経由・反映1〜2分）":"ブックマークに追加（Issue経由・反映1〜2分）"}">${bm?"★済み":"☆ 保存"}</a>
      </div>
    </div>
  </article>`;
}

function render(){
  $("months").style.display = tab === "archive" ? "flex" : "none";
  $("topics").style.display = tab === "links" ? "none" : "flex";
  if(tab === "links"){ renderLinks(); return; }
  if(tab === "archive") renderMonths();
  const pool = filtered();
  const page = pool.slice(0, shown);
  $("grid").className = "grid";
  $("grid").innerHTML = page.length
    ? page.map(card).join("")
    : `<div class="empty">${emptyText()}</div>`;
  $("more").style.display = pool.length > shown ? "block" : "none";
  $("status").textContent = pool.length ? `${pool.length}件` : "";
}

function emptyText(){
  if(tab === "bookmarks") return "ブックマークはまだありません。記事の「☆ 保存」から追加できます（リポジトリ所有者のみ）。";
  if(tab === "archive")   return archiveMonth ? "この月の記事はありません。" : "上の月ボタンを選んでください。";
  if(topics.size)         return "該当する記事がありません。上の「AI」「SNSマーケ」の絞り込みを外すと増えます。";
  return "該当する記事がありません。";
}

function renderMonths(){
  $("months").innerHTML = (meta.archive_months||[]).map(m =>
    `<button data-m="${m}" class="${m===archiveMonth?"active":""}">${m}</button>`).join("") ||
    '<span style="font-size:.8rem;color:var(--muted)">アーカイブはまだありません。</span>';
  $("months").querySelectorAll("button").forEach(btn =>
    btn.addEventListener("click", async () => {
      archiveMonth = btn.dataset.m; shown = PAGE;
      try{ archiveItems = await fetch(`data/archive/${archiveMonth}.json`).then(r => r.json()); }
      catch(e){ archiveItems = []; }
      render();
    }));
}

function renderLinks(){
  const ls = meta.manual_links || [];
  $("grid").className = "links";
  $("grid").innerHTML = ls.length ? ls.map(l => `
    <div class="lk">
      <div class="name">${esc(l.name)}</div>
      <div class="note">${esc(l.note||"")}</div>
      ${l.url ? `<a href="${esc(l.url)}" target="_blank" rel="noopener">開く →</a>` : ""}
    </div>`).join("")
    : '<div class="empty">リンクは未登録です。sources.yml の manual_links に追加してください。</div>';
  $("more").style.display = "none";
  $("status").textContent = "";
  $("months").style.display = "none";
}

boot();
</script>
</body>
</html>
